<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AI Control</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="popup.css">
</head>
<body>

  <!-- ── Cabecera: marca neutra + resumen global ── -->
  <header class="hdr">
    <div class="hdr-top">
      <div class="brand">
        <img src="../icons/icon48.png" alt="" width="18" height="18">
        <h1>AI&nbsp;Control</h1>
      </div>
      <button id="hdr-status" class="status" type="button" data-i18n-title="monitorStatus">
        <span class="status-dot"></span><span class="status-txt" id="status-txt">OK</span>
      </button>
    </div>
    <div class="summary" id="summary" aria-live="polite"></div>
  </header>

  <!-- ── Tareas: lista unificada ordenada por prioridad ── -->
  <section class="panel">
    <ul id="tasks" class="tasks"></ul>
    <div id="tasks-empty" class="empty" hidden>
      <span class="empty-title" data-i18n="noTabs">No AI tabs open</span>
      <span class="empty-hint" data-i18n="noTabsHint">Open Claude, ChatGPT or Gemini and this panel detects them automatically.</span>
    </div>
  </section>

  <!-- ── Uso: los tres proveedores con el mismo contrato ── -->
  <section class="panel usage" id="usage-panel">
    <button class="usage-head" id="usage-toggle" type="button" aria-expanded="true" aria-controls="usage-body">
      <span class="usage-title" data-i18n="popupUsage">Usage</span>
      <span class="usage-peek mono" id="usage-peek"></span>
      <span class="chev" id="usage-chev">▾</span>
    </button>

    <div id="usage-body">
      <div id="usage-providers"></div>
      <div class="usage-foot">
        <span class="mono" id="usage-meta"></span>
        <button id="usage-refresh" class="ghost" type="button" data-i18n-title="refreshNow">↻</button>
      </div>
    </div>
  </section>

  <!-- ── Pie ── -->
  <footer class="foot">
    <label class="toggle"><input type="checkbox" id="t-notify"> <span data-i18n="toggleNotifications">Notifications</span></label>
    <label class="toggle"><input type="checkbox" id="t-sound"> <span data-i18n="toggleSound">Sound</span></label>
    <button class="ghost settings" id="open-options" type="button" data-i18n-title="openOptions">⚙</button>
  </footer>

<script src="../shared/i18n.js"></script>
<script src="popup.js"></script>
</body>
</html>
